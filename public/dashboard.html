<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Siswa</title>
    <link rel="stylesheet" href="/css/style/hiasan.css">
</head>
<body class="dashboard-page">
    <div class="dashboard-shell">
        <nav class="glass-panel topbar">
            <div class="brand">
                <span class="brand-badge">S</span>
                <div>
                    <strong>School Panel</strong>
                    <small>Dashboard</small>
                </div>
            </div>
            <div class="nav-links">
                <a href="/dashboard" class="active">Dashboard</a>
                <button id="logoutButton" type="button" class="logout-button">Logout</button>
            </div>
        </nav>

        <main class="dashboard-main">
            <section class="stats-row">
                <div class="glass-panel stat-card">
                    <p>Total Siswa</p>
                    <h3 id="studentCount">0</h3>
                </div>
                <div class="glass-panel stat-card">
                    <p>Status</p>
                    <h3 id="activeClass">Aktif</h3>
                </div>
            </section>

            <section class="glass-panel form-panel">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">Data Siswa</p>
                        <h2 id="formTitle">Tambah Siswa</h2>
                    </div>
                    <button id="cancelEdit" type="button" class="secondary-button" hidden>Batalkan Edit</button>
                </div>

                <form id="studentForm" class="student-form">
                    <div class="form-grid">
                        <div>
                            <label for="nis">NIS</label>
                            <input id="nis" name="nis" type="text" placeholder="Contoh: 2024001" required>
                        </div>
                        <div>
                            <label for="nama">Nama</label>
                            <input id="nama" name="nama" type="text" placeholder="Nama lengkap" required>
                        </div>
                        <div>
                            <label for="kelas">Kelas</label>
                            <input id="kelas" name="kelas" type="text" placeholder="Contoh: XII-A" required>
                        </div>
                        <div>
                            <label for="jurusan">Jurusan</label>
                            <input id="jurusan" name="jurusan" type="text" placeholder="Contoh: RPL" required>
                        </div>
                        <div class="full-width">
                            <label for="email">Email</label>
                            <input id="email" name="email" type="email" placeholder="siswa@example.com" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="primary-button">Simpan</button>
                    </div>
                </form>

                <p id="messageBox" class="message-box success">Siap menerima data siswa baru.</p>
            </section>

            <section class="glass-panel table-panel">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">List</p>
                        <h2>Daftar Siswa</h2>
                    </div>
                </div>

                <div class="table-wrap">
                    <table id="studentTable">
                        <thead>
                            <tr>
                                <th>NIS</th>
                                <th>Nama</th>
                                <th>Kelas</th>
                                <th>Jurusan</th>
                                <th>Email</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="confirmModal" class="modal hidden" aria-hidden="true">
        <div class="modal-card glass-panel">
            <h3>Konfirmasi</h3>
            <p id="confirmMessage">Apakah Anda yakin ingin melanjutkan?</p>
            <div class="modal-actions">
                <button type="button" id="confirmCancel" class="secondary-button">Batal</button>
                <button type="button" id="confirmDelete" class="danger-button">Hapus</button>
            </div>
        </div>
    </div>

    <script src="/js/dashboard.js"></script>
</body>
</html>
